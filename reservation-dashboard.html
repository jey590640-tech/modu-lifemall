 <!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>모두의 라이프몰 예약관리</title>
<style>
body{font-family:Arial,sans-serif;background:#f3f5f8;margin:0;padding:20px;color:#222}
main{max-width:900px;margin:auto;background:white;padding:24px;border-radius:14px}
h1{color:#1768bd}table{width:100%;border-collapse:collapse}th,td{border:1px solid #ddd;padding:10px;text-align:left}th{background:#edf4fc}.notice{padding:14px;background:#fff6e5;border-radius:8px}
</style>
</head>
<body>
<main>
<h1>모두의 라이프몰 예약관리</h1>
<p class="notice">관리자 전용 화면 준비 중입니다. 실제 예약정보는 아직 연결하지 않았습니다.</p>
<h2>예약 현황</h2>
<table><thead><tr><th>예약자</th><th>전화번호 끝 4자리</th><th>상품</th><th>수량</th><th>금액</th><th>입금</th><th>수령</th></tr></thead><tbody><tr><td colspan="7">관리자 인증 및 예약정보 연결 전입니다.</td></tr></tbody></table>
</main>
<script type="module">
// Firebase 연결 준비
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getAuth } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import { getFirestore, collection, getDocs } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
import { onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
// 관리자 로그인 상태 확인 준비
const firebaseConfig = {
    apiKey: "AIzaSyBCCgUBCuVyV6foO-Fn36HxktnKytK7hcc",
    authDomain: "modu-lifemall.firebaseapp.com",
    projectId: "modu-lifemall",
    storageBucket: "modu-lifemall.firebasestorage.app",
    messagingSenderId: "292905385866",
    appId: "1:292905385866:web:0cc50da9d5ddb8bf02d273"
  };
 const app = initializeApp(firebaseConfig); 
const auth = getAuth();
const db = getFirestore();
const reservationsRef = collection(db, "reservations");
onAuthStateChanged(auth, async (user) => {
if (!user) return;
const snapshot = await getDocs(reservationsRef);
console.log("예약 건수:", snapshot.size);
}); 
 
</script> 
</body>
</html>
