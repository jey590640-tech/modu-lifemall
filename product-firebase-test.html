
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>모두의 라이프몰 Firebase 상품 연결 시험</title>
<style>
body {
  font-family: Arial, sans-serif;
  background: #f5f7fa;
  padding: 24px;
}
main {
  max-width: 600px;
  margin: auto;
  background: white;
  padding: 24px;
  border-radius: 12px;
}
h1 { color: #1768c4; }
</style>
</head>
<body>
<main>
<h1>모두의 라이프몰</h1>
<h2>Firebase 상품 연결 준비</h2>
<p>시험용 페이지가 정상적으로 열렸습니다.</p>
<p>현재 Firebase 데이터는 읽거나 변경하지 않습니다.</p>
<p>상품 연결 기능은 다음 단계에서 추가합니다.</p>
<button type="button">예약하기</button>
</main>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-app.js";
const firebaseConfig = {
apiKey: "AIzaSyBCCgUBCuVyV6foO-Fn36HxktnKytK7hcc", 
authDomain: "modu-lifemall.firebaseapp.com",
projectId: "modu-lifemall",
storageBucket: "modu-lifemall.firebasestorage.app",  
messagingSenderId: "292905385866",
appId: "1:292905385866:web:0cc50da9d5ddb8bf02d273",  
};
const app = initializeApp(firebaseConfig);
console.log("Firebase 초기화 완료"); 
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-firestore.js";
const db = getFirestore(app);
const productRef = collection(db, "products");
const productSnap = await getDocs(productRef);
console.log("상품 조회 결과:", productSnap.size);

productSnap.forEach((item) => { const p = item.data(); document.querySelector("main").innerHTML = `<h2>${p.name}</h2><p>판매가격: ${Number(p.price).toLocaleString("ko-KR")}원</p><p>재고: ${p.stock}개</p><button type="button">예약하기</button>`; });
const reservationForm = document.createElement("div");
reservationForm.style.display = "none";
document.querySelector("main").appendChild(reservationForm);  
reservationForm.innerHTML = '<h3>예약자 정보 입력</h3><input placeholder="닉네임"><input placeholder="전화번호 끝 4자리"><input type="number" min="1" placeholder="수량"><button type="button">예약 확인</button>';  
reservationForm.style.display = "block";
reservationForm.style.display = "none";
document.querySelector("main button").addEventListener("click", () => { reservationForm.style.display = "block"; });

reservationForm.querySelector("button").addEventListener("click", () => {
const quantity = Number(reservationForm.querySelector('input[type="number"]').value);
if (!Number.isInteger(quantity) || quantity < 1 || quantity > Number(p.stock)) {
  alert("예약 수량은 1개부터 " + p.stock + "개까지 입력해 주세요.");
  return;
}
  alert("예약 확인 버튼이 정상 작동합니다. 아직 실제 예약은 저장되지 않았습니다.");
});
</script>  
</body>
</html>
