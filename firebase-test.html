<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">

<body>
<script type="module">
  // Import the functions you need from the SDKs you need
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-firestore.js";
import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-auth.js";  
  // TODO: Add SDKs for Firebase products that you want to use
  // https://firebase.google.com/docs/web/setup#available-libraries

  // Your web app's Firebase configuration
  const firebaseConfig = {
    apiKey: "AIzaSyBCCgUBCuVyV6foO-Fn36HxktnKytK7hcc",
    authDomain: "modu-lifemall.firebaseapp.com",
    projectId: "modu-lifemall",
    storageBucket: "modu-lifemall.firebasestorage.app",
    messagingSenderId: "292905385866",
    appId: "1:292905385866:web:0cc50da9d5ddb8bf02d273"
  };

  // Initialize Firebase
  const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const reservationsRef = collection(db, "reservations");  
const snapshot = await getDocs(reservationsRef);  
document.getElementById("result").textContent = "예약 건수: " + snapshot.size; 
  console.log("Firebase 초기화 코드 실행 완료");
</script>
<p id="result">예약 정보 확인 준비 중...</p>
<h2>모두의 라이프몰 연결 테스트</h2>
<p>Firebase 연결을 확인하는 연습 페이지입니다.</p>
<h3>관리자 로그인</h3>
<input id="email" type="email" placeholder="이메일">
<input id="password" type="password" placeholder="비밀번호">
<button id="loginBtn">로그인</button>
<p id="loginResult"></p>  
<script type="module">
import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-auth.js";
import { getApp } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js";
const app = getApp();
const auth = getAuth(app);  
 const auth = getAuth(app);
const loginBtn = document.getElementById("loginBtn");
loginBtn.addEventListener("click", async () => {
const email = document.getElementById("email").value;
const password = document.getElementById("password").value;
try {
await signInWithEmailAndPassword(auth, email, password);
document.getElementById("loginResult").textContent = "로그인 성공!";
} catch (error) {
document.getElementById("loginResult").textContent = "로그인 실패: " + error.code;
}
});
</script>  
</body>
</html>
